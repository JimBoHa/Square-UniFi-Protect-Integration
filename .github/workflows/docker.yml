name: docker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check Rust formatting
        run: rustup run 1.88.0 cargo fmt --all -- --check
      - name: Lint Rust backend
        run: rustup run 1.88.0 cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test Rust backend
        run: rustup run 1.88.0 cargo test --locked --all-targets
      - name: Build image
        run: docker build -t square-unifi-protect:ci .
      - name: Smoke test
        run: |
          docker run -d --name spi -p 8000:8000 square-unifi-protect:ci
          for _ in $(seq 1 20); do
            curl -kfs https://127.0.0.1:8000/api/status && exit 0
            sleep 1
          done
          docker logs spi
          exit 1
