[package]
name = "square-unifi-protect"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Link Square POS transactions to UniFi Protect camera footage"
license = "MIT"

[lib]
name = "square_unifi_protect"
path = "src/lib.rs"

[[bin]]
name = "square-unifi-protect"
path = "src/main.rs"

[[bin]]
name = "square-protect-menubar"
path = "src/bin/square-protect-menubar.rs"
required-features = ["menubar"]

[features]
default = []
menubar = []

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["macros", "query"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
if-addrs = "0.15"
libc = "0.2"
rand = "0.9"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "query", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "fs", "limit", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.13", default-features = false }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
