services:
  square-protect:
    build: .
    # For a published image instead of building locally:
    # image: ghcr.io/jimboha/square-unifi-protect:latest
    container_name: square-protect
    restart: unless-stopped
    ports:
      - "3546:3546"
    environment:
      # Remote first-run setup must use the app's built-in TLS. The app
      # generates a one-time setup secret at startup instead of retaining one
      # in container metadata.
      SPI_PORT: "3546"
      SPI_TLS: "1"
    volumes:
      - ./data:/data
